<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rener — Assistente de IA</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="newChatBtn" class="ghost-btn" type="button">Nova conversa</button>
      <div class="brand-title">✦ Rener</div>
      <div id="statusBadge" class="status-badge">Online</div>
    </header>

    <main id="chatArea" class="chat-area">
      <div id="welcomeCard" class="welcome-card">
        <h1>Olá, Rener, vamos começar</h1>
        <p>Rener — Assistente de IA</p>
      </div>
    </main>

    <div id="attachmentBar" class="attachment-bar hidden">
      <div class="attachment-info">
        <img id="attachmentThumb" class="attachment-thumb hidden" alt="Pré-visualização" />
        <span id="attachmentName" class="attachment-name"></span>
      </div>
      <button id="removeAttachmentBtn" class="remove-attachment-btn" type="button" title="Remover anexo">✕</button>
    </div>

    <div id="plusMenu" class="plus-menu hidden" role="menu" aria-label="Opções de anexo e criação">
      <div class="plus-sources">
        <button id="optPhotos" class="source-tile" type="button">
          <span class="source-icon">🖼️</span>
          <span>Fotos</span>
        </button>
        <button id="optCamera" class="source-tile" type="button">
          <span class="source-icon">📷</span>
          <span>Câmera</span>
        </button>
        <button id="optFiles" class="source-tile" type="button">
          <span class="source-icon">📎</span>
          <span>Arquivos</span>
        </button>
        <button id="optDrive" class="source-tile" type="button">
          <span class="source-icon">△</span>
          <span>Drive</span>
        </button>
      </div>

      <button id="optCreateImage" class="menu-action-row" type="button">
        <span class="action-icon">🎨</span>
        <span class="action-text">
          <strong>Crie imagens</strong>
          <small>Visualizar e editar</small>
        </span>
      </button>
    </div>

    <footer class="composer-wrap">
      <form id="composerForm" class="composer">
        <input id="photoInput" type="file" class="hidden" accept="image/*" />
        <input id="cameraInput" type="file" class="hidden" accept="image/*" capture="environment" />
        <input
          id="fileInput"
          type="file"
          class="hidden"
          accept=".pdf,.txt,.md,.csv,.json,.xml,.yaml,.yml,.py,.js,.ts,.jsx,.tsx,.html,.css,.sql,.log,image/*"
        />

        <button id="attachBtn" class="icon-btn" type="button" title="Abrir opções">＋</button>
        <textarea
          id="promptInput"
          rows="1"
          placeholder="Peça ao Rener"
          autocomplete="off"
        ></textarea>
        <button id="micBtn" class="icon-btn" type="button" title="Gravar voz">🎤</button>
        <button id="sendBtn" class="send-btn" type="submit" title="Enviar">↑</button>
      </form>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
