
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101114">
    <meta name="description" content="Rener IA - Seu assistente inteligente">
    <title>Rener IA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>Rener IA</h2>
                <button id="close-sidebar" class="icon-button" aria-label="Fechar menu">×</button>
            </div>

            <button id="new-chat" class="new-chat-button">
                + Nova conversa
            </button>

            <div class="sidebar-content">
                <p class="sidebar-label">Conversas</p>
                <div id="conversation-list"></div>
            </div>

            <div class="sidebar-footer">
                <button id="settings-button" class="sidebar-option">
                    ⚙️ Configurações
                </button>
            </div>
        </aside>

        <main class="main-content">

            <header class="topbar">
                <button id="menu-button" class="icon-button" aria-label="Abrir menu">
                    ☰
                </button>

                <h1>Rener IA</h1>

                <div class="topbar-actions">
                    <button id="clear-chat" class="icon-button" title="Limpar conversa">
                        🗑️
                    </button>
                </div>
            </header>

            <section class="chat-container" id="chat-container">
                <div class="welcome-screen" id="welcome-screen">
                    <div class="welcome-logo">R</div>
                    <h2>Olá! Eu sou a Rener IA.</h2>
                    <p>Como posso ajudar você hoje?</p>
                </div>

                <div id="chat-messages" class="chat-messages"></div>
            </section>

            <footer class="composer-area">
                <div id="attachment-preview" class="attachment-preview"></div>

                <div class="composer">

                    <div class="composer-tools">
                        <button id="attachment-button" class="icon-button" title="Anexar">
                            +
                        </button>

                        <div id="attachment-menu" class="attachment-menu hidden">
                            <button id="camera-button">📷 Câmera</button>
                            <button id="gallery-button">🖼️ Galeria</button>
                            <button id="files-button">📁 Arquivos</button>
                        </div>
                    </div>

                    <textarea
                        id="message-input"
                        class="message-input"
                        placeholder="Pergunte alguma coisa..."
                        rows="1"
                    ></textarea>

                    <button id="mic-button" class="icon-button" title="Gravar áudio">
                        🎤
                    </button>

                    <button id="send-button" class="send-button" title="Enviar mensagem">
                        ➤
                    </button>
                </div>

                <p class="disclaimer">
                    A Rener IA pode cometer erros. Confira informações importantes.
                </p>
            </footer>

        </main>
    </div>

    <!-- Câmera -->
    <input
        type="file"
        id="camera-input"
        accept="image/*"
        capture="environment"
        hidden
    >

    <!-- Galeria: somente imagens -->
    <input
        type="file"
        id="gallery-input"
        accept="image/*"
        hidden
    >

    <!-- Arquivos: somente documentos, sem imagens -->
    <input
        type="file"
        id="files-input"
        accept=".pdf,.txt,.doc,.docx,.csv,.xlsx,.xls,.json"
        hidden
    >

    <script src="app.js" defer></script>
</body>
</html>
