<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rener</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --bg-main: #060911;
      --bg-surface: rgba(15, 23, 42, 0.88);
      --bg-user: linear-gradient(135deg, #2563eb, #1d4ed8);
      --bg-bot: rgba(15, 23, 42, 0.94);
      --border-subtle: rgba(148, 163, 184, 0.16);
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: radial-gradient(circle at top, #172554 0%, var(--bg-main) 64%);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, textarea, input, select { font-family: inherit; }
    .hidden { display: none !important; }

    .drawer-backdrop {
      position: fixed; inset: 0; background: rgba(2, 6, 23, 0.65);
      backdrop-filter: blur(6px); z-index: 40; opacity: 0; pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .side-drawer {
      position: fixed; top: 0; left: 0; bottom: 0;
      width: min(84vw, 320px); background: #090d18;
      border-right: 1px solid var(--border-subtle); z-index: 50;
      display: flex; flex-direction: column; padding: 18px 14px; gap: 12px;
      transform: translateX(-100%); transition: transform 0.25s ease;
    }
    .side-drawer.open { transform: translateX(0); }

    .drawer-header {
      display: flex; align-items: center; justify-content: space-between;
      padding-bottom: 10px; border-bottom: 1px solid var(--border-subtle);
    }
    .drawer-title { font-size: 1.05rem; font-weight: 700; }
    .drawer-close-btn {
      width: 34px; height: 34px; border-radius: 50%;
      border: 1px solid var(--border-subtle); background: rgba(255,255,255,0.05);
      color: var(--text-primary); cursor: pointer;
    }
    .drawer-section { display: flex; flex-direction: column; gap: 4px; }
    .drawer-section-label {
      font-size: 0.72rem; font-weight: 600; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 10px 2px;
    }
    .drawer-nav-btn {
      width: 100%; border: none; background: transparent; color: var(--text-primary);
      border-radius: 12px; padding: 10px 12px; display: flex; align-items: center;
      gap: 10px; font-size: 0.92rem; font-weight: 500; text-align: left; cursor: pointer;
    }
    .drawer-nav-btn:hover { background: rgba(59, 130, 246, 0.16); }
    .drawer-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .drawer-item-card {
      width: 100%; border: 1px solid var(--border-subtle); background: rgba(255,255,255,0.03);
      color: var(--text-primary); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer;
    }
    .drawer-item-card strong { display: block; font-size: 0.86rem; font-weight: 600; }
    .drawer-item-card small { display: block; font-size: 0.75rem; color: var(--text-muted); }
    .drawer-footer {
      padding-top: 10px; border-top: 1px solid var(--border-subtle);
      display: flex; align-items: center; justify-content: space-between;
    }

    .app-shell {
      display: flex; flex-direction: column; height: 100dvh;
      max-width: 900px; margin: 0 auto; position: relative;
    }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 12px 16px; border-bottom: 1px solid var(--border-subtle);
      background: rgba(7, 11, 20, 0.82); backdrop-filter: blur(14px);
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .menu-trigger-btn {
      width: 36px; height: 36px; border-radius: 12px;
      border: 1px solid var(--border-subtle); background: rgba(255,255,255,0.05);
      color: var(--text-primary); font-size: 1.05rem; cursor: pointer;
    }
    .brand-title { font-weight: 700; font-size: 1.05rem; }
    .status-badge { font-size: 0.78rem; color: #4ade80; font-weight: 600; }
    .ghost-btn {
      background: rgba(255,255,255,0.05); color: var(--text-muted);
      border: 1px solid var(--border-subtle); border-radius: 999px;
      padding: 6px 12px; font-size: 0.8rem; cursor: pointer;
    }

    .chat-area {
      flex: 1; overflow-y: auto; padding: 18px 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    .welcome-card {
      margin: auto; text-align: center; padding: 24px 20px; border-radius: 22px;
      background: var(--bg-surface); border: 1px solid var(--border-subtle); max-width: 420px;
    }
    .welcome-card h1 { font-size: 1.32rem; margin-bottom: 6px; }
    .welcome-card p { color: var(--text-muted); font-size: 0.9rem; }

    .message {
      max-width: 84%; padding: 12px 15px; border-radius: 18px;
      line-height: 1.55; font-size: 0.95rem; white-space: pre-wrap; word-wrap: break-word;
    }
    .message.user {
      align-self: flex-end; background: var(--bg-user); border-bottom-right-radius: 6px;
    }
    .message.assistant {
      align-self: flex-start; background: var(--bg-bot); border: 1px solid var(--border-subtle);
      border-bottom-left-radius: 6px;
    }
    .message img, .message video {
      display: block; width: 100%; max-width: 420px; border-radius: 14px; margin-top: 8px;
    }
    .download-img-btn {
      margin-top: 8px; display: inline-flex; align-items: center; gap: 6px;
      background: rgba(59, 130, 246, 0.18); color: #dbeafe;
      border: 1px solid rgba(147, 197, 253, 0.35); border-radius: 999px;
      padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }

    .attachment-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin: 0 16px 8px; padding: 8px 12px; border-radius: 14px;
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
    }
    .attachment-info { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .attachment-thumb { width: 36px; height: 36px; object-fit: cover; border-radius: 8px; }
    .attachment-name { font-size: 0.84rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .remove-attachment-btn { background: transparent; border: none; color: var(--text-muted); cursor: pointer; }

    .plus-menu {
      margin: 0 16px 10px; padding: 12px; border-radius: 20px;
      background: var(--bg-surface); border: 1px solid var(--border-subtle);
      display: flex; flex-direction: column; gap: 8px;
    }
    .plus-sources { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .source-tile {
      background: rgba(255,255,255,0.04); border: 1px solid var(--border-subtle);
      border-radius: 14px; padding: 10px 6px; color: var(--text-primary);
      display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.78rem; cursor: pointer;
    }
    .menu-action-row {
      width: 100%; background: transparent; border: none; border-radius: 12px;
      padding: 9px; color: var(--text-primary); display: flex; align-items: center;
      gap: 10px; text-align: left; cursor: pointer;
    }
    .menu-action-row:hover { background: rgba(255,255,255,0.06); }
    .action-text { display: flex; flex-direction: column; }
    .action-text strong { font-size: 0.88rem; }
    .action-text small { font-size: 0.75rem; color: var(--text-muted); }

    .composer-wrap {
      padding: 10px 16px 14px; background: rgba(7, 11, 20, 0.88);
      border-top: 1px solid var(--border-subtle);
    }
    .composer {
      display: flex; align-items: flex-end; gap: 8px; padding: 8px 10px;
      border-radius: 24px; background: var(--bg-surface); border: 1px solid var(--border-subtle);
    }
    .composer textarea {
      flex: 1; background: transparent; border: none; outline: none;
      color: var(--text-primary); font-size: 0.95rem; line-height: 1.4;
      max-height: 130px; resize: none; padding: 6px 4px;
    }
    .icon-btn, .send-btn {
      width: 38px; height: 38px; border-radius: 50%; border: none;
      cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .icon-btn { background: rgba(255,255,255,0.08); color: var(--text-primary); }
    .icon-btn.recording { background: #dc2626; color: #fff; }
    .send-btn { background: var(--accent); color: #fff; font-weight: 700; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
  <div id="drawerBackdrop" class="drawer-backdrop"></div>

  <aside id="sideDrawer" class="side-drawer" aria-label="Menu lateral">
    <div class="drawer-header">
      <span class="drawer-title">Rener</span>
      <button id="drawerCloseBtn" class="drawer-close-btn" type="button" aria-label="Fechar menu">✕</button>
    </div>

    <div class="drawer-section">
      <button id="navNewChatBtn" class="drawer-nav-btn" type="button">
        <span>✎</span><span>Nova conversa</span>
      </button>
      <button id="navLibraryBtn" class="drawer-nav-btn" type="button">
        <span>⊞</span><span>Biblioteca</span>
      </button>
      <button id="navImagesBtn" class="drawer-nav-btn" type="button">
        <span>🖼</span><span>Imagens</span>
      </button>
      <button id="navScheduledBtn" class="drawer-nav-btn" type="button">
        <span>◔</span><span>Programado</span>
      </button>
      <button id="navCustomizeBtn" class="drawer-nav-btn" type="button">
        <span>◎</span><span>Personalizar</span>
      </button>
      <button id="navVideosBtn" class="drawer-nav-btn" type="button">
        <span>🎬</span><span>Vídeos</span>
      </button>
    </div>

    <div class="drawer-section-label">Conversas e atalhos</div>
    <div id="drawerList" class="drawer-scroll"></div>

    <div class="drawer-footer">
      <span id="drawerModeText" class="status-badge">Modo Padrão</span>
      <button id="drawerClearHistoryBtn" class="ghost-btn" type="button">Limpar</button>
    </div>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button id="openDrawerBtn" class="menu-trigger-btn" type="button" aria-label="Abrir menu">☰</button>
        <span class="brand-title">Rener</span>
      </div>
      <span id="statusBadge" class="status-badge">Online</span>
      <button id="clearBtn" class="ghost-btn" type="button">Nova conversa</button>
    </header>

    <main id="chatArea" class="chat-area">
      <div id="welcomeCard" class="welcome-card">
        <h1>Olá, sou o Rener</h1>
        <p>Conversa, imagens, vídeos e análise de arquivos em um só lugar. Puxe pela esquerda para abrir o menu.</p>
      </div>
    </main>

    <div id="attachmentBar" class="attachment-bar hidden">
      <div class="attachment-info">
        <img id="attachmentThumb" class="attachment-thumb hidden" alt="Pré-visualização" />
        <span id="attachmentName" class="attachment-name"></span>
      </div>
      <button id="removeAttachmentBtn" class="remove-attachment-btn" type="button">✕</button>
    </div>

    <div id="plusMenu" class="plus-menu hidden">
      <div class="plus-sources">
        <button id="cameraTileBtn" class="source-tile" type="button">
          <span>📷</span><span>Câmera</span>
        </button>
        <button id="galleryTileBtn" class="source-tile" type="button">
          <span>🖼</span><span>Galeria</span>
        </button>
        <button id="filesTileBtn" class="source-tile" type="button">
          <span>📄</span><span>Arquivos</span>
        </button>
        <button id="imagePromptTileBtn" class="source-tile" type="button">
          <span>✨</span><span>Imagem</span>
        </button>
      </div>

      <button id="videoPromptRowBtn" class="menu-action-row" type="button">
        <span>🎬</span>
        <span class="action-text">
          <strong>Gerar vídeo curto</strong>
          <small>Prepara um pedido de vídeo no campo de texto</small>
        </span>
      </button>

      <button id="creatorKeyRowBtn" class="menu-action-row" type="button">
        <span>🔑</span>
        <span class="action-text">
          <strong>Chave Criador / Código Pro</strong>
          <small>Configura o acesso sem limite de cota</small>
        </span>
      </button>
    </div>

    <div class="composer-wrap">
      <form id="composerForm" class="composer">
        <button id="plusBtn" class="icon-btn" type="button" aria-label="Mais opções">+</button>
        <textarea id="promptInput" rows="1" placeholder="Escreva uma mensagem..."></textarea>
        <button id="micBtn" class="icon-btn" type="button" aria-label="Gravar voz">🎤</button>
        <button id="sendBtn" class="send-btn" type="submit" aria-label="Enviar">➤</button>
      </form>
    </div>

    <input id="cameraInput" type="file" accept="image/*" capture="environment" class="hidden" />
    <input id="galleryInput" type="file" accept="image/*" class="hidden" />
    <input id="fileInput" type="file" accept=".pdf,.txt,.md,.csv,.json,.xml,.yaml,.yml,.py,.js,.ts,.jsx,.tsx,.html,.css,.sql,.log,image/*" class="hidden" />
  </div>

  <script src="app.js"></script>
</body>
</html>
