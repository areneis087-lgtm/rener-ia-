<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Rener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button id="btn-new-chat" class="ghost-btn" type="button" title="Nova conversa">Nova conversa</button>
      <div class="brand">
        <span class="sparkle">✦</span>
        <span class="brand-name">Rener</span>
      </div>
      <span class="status-pill" id="api-status">Online</span>
    </header>

    <main id="chat-area" class="chat-area">
      <div id="hero" class="hero-box">
        <div class="hero-sparkle">✦</div>
        <h1 class="hero-title">Olá, Rener, vamos começar</h1>
        <p class="hero-sub">Rener • Assistente de IA</p>
      </div>
      <div id="messages" class="messages"></div>
    </main>

    <footer class="composer-wrap">
      <form id="chat-form" class="composer" autocomplete="off">
        <textarea
          id="prompt-input"
          rows="1"
          placeholder="Peça ao Rener"
          aria-label="Peça ao Rener"
        ></textarea>

        <button
          id="mic-btn"
          class="icon-btn mic-btn"
          type="button"
          title="Falar com o Rener"
          aria-label="Falar com o Rener"
        >
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="12" rx="3"></rect>
            <path d="M5 10v1a7 7 0 0 0 14 0v-1"></path>
            <line x1="12" y1="18" x2="12" y2="22"></line>
            <line x1="8" y1="22" x2="16" y2="22"></line>
          </svg>
        </button>

        <button
          id="send-btn"
          class="icon-btn send-btn"
          type="submit"
          title="Enviar"
          aria-label="Enviar"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="19" x2="12" y2="5"></line>
            <polyline points="5 12 12 5 19 12"></polyline>
          </svg>
        </button>
      </form>
      <div id="recording-hint" class="recording-hint hidden">Ouvindo... toque no microfone para enviar.</div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
